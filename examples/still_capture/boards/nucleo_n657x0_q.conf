# Video buffer pool in AXISRAM3..6, carved out by the matching overlay.
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="VIDEORAM"
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=1835008

# Use RTT instead of UART
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_SEGGER_RTT_SECTION_CUSTOM_DTS_REGION=y
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
