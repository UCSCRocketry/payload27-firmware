CONFIG_VIDEO=y
CONFIG_VIDEO_ENCODER_JPEG=y

# CONFIG_STILL_CAPTURE_NUM_BUFS capture buffers plus one for the JPEG.
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=3

# Turn the CPU caches on.
CONFIG_CACHE_MANAGEMENT=y

# Align the buffer pool with the cache lines
CONFIG_VIDEO_BUFFER_POOL_ALIGN=64

# Enable crc32_ieee().
CONFIG_CRC=y

CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
