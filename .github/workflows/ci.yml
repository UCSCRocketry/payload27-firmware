name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci:v0.29.4
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: examples/hello_world
            board: nucleo_n657x0_q
          - app: examples/still_capture
            board: nucleo_n657x0_q
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload-firmware
      - name: Initialise workspace
        run: |
          west init -l payload-firmware
          west update --narrow -o=--depth=1
          west zephyr-export
      - name: Build ${{ matrix.app }} for ${{ matrix.board }}
        run: west build -b ${{ matrix.board }} payload-firmware/${{ matrix.app }}
